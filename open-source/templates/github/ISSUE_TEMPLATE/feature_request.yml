name: 功能建议
description: 描述使用场景和希望解决的问题
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        ToFA 优先保持离线、隐私和双端稳定。新增联网服务、账号体系、统计或广告能力不在普通功能建议范围内。
  - type: dropdown
    id: platform
    attributes:
      label: 涉及端
      options:
        - 手机端
        - 手表端
        - 双端同步
        - 文档与构建
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 使用场景与现有问题
      description: 说明谁在什么情况下遇到什么问题
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 说明期望行为、界面或兼容性要求
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案与影响
      description: 是否涉及权限、存储格式、第三方依赖或旧设置迁移
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 本建议不包含真实用户数据，并尽量保持离线工作方式
          required: true
